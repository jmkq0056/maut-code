name: build-linux-x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      NODE_OPTIONS: --max-old-space-size=8192
      # run npm lifecycle scripts serially — parallel sub-installs race over
      # extensions/node_modules and delete @parcel/watcher mid-compile
      npm_config_foreground_scripts: "true"
      # use @parcel/watcher's prebuilt N-API binary instead of compiling it in
      # extensions/node_modules — the compile is what loses the race above
      npm_config_build_from_source: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ python3 pkg-config \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot rsync

      - name: Install npm dependencies
        run: npm ci || npm ci

      - name: Build linux-x64
        run: npm run gulp vscode-linux-x64

      - name: Pack artifact
        run: tar -C .. -czf maut-code-linux-x64.tar.gz VSCode-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: maut-code-linux-x64
          path: maut-code-linux-x64.tar.gz
          retention-days: 7
